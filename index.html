<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>MySchool — Il tuo compagno di studio</title>
  <meta name="description" content="Organizza lo studio, scrivi temi, esercitati in matematica, traduci l'inglese e scopri la storia: tutto in un'unica app." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0e14" id="theme-color-meta" />

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MySchool" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div id="app-shell">
    <header class="topbar glass">
      <div class="topbar-inner">
        <span class="brand"><img src="icons/icon-192.png" alt="" class="brand-mark" width="28" height="28" /><strong>MySchool</strong></span>
      </div>
    </header>

    <main id="view" class="view" role="main"></main>

    <nav class="bottom-nav glass" id="bottom-nav" aria-label="Navigazione principale">
      <span class="nav-pill" id="nav-pill" aria-hidden="true"></span>
      <a href="#/" class="nav-item" data-route="studio">
        <span class="nav-icon" data-icon="studio"></span>
        <span class="nav-label">Studio</span>
      </a>
      <a href="#/italiano" class="nav-item" data-route="italiano">
        <span class="nav-icon" data-icon="italiano"></span>
        <span class="nav-label">Italiano</span>
      </a>
      <a href="#/matematica" class="nav-item" data-route="matematica">
        <span class="nav-icon" data-icon="matematica"></span>
        <span class="nav-label">Matematica</span>
      </a>
      <a href="#/inglese" class="nav-item" data-route="inglese">
        <span class="nav-icon" data-icon="inglese"></span>
        <span class="nav-label">Inglese</span>
      </a>
      <a href="#/storia" class="nav-item" data-route="storia">
        <span class="nav-icon" data-icon="storia"></span>
        <span class="nav-label">Storia</span>
      </a>
      <a href="#/voti" class="nav-item" data-route="voti">
        <span class="nav-icon" data-icon="voti"></span>
        <span class="nav-label">Voti</span>
      </a>
      <a href="#/impostazioni" class="nav-item" data-route="impostazioni">
        <span class="nav-icon" data-icon="impostazioni"></span>
        <span class="nav-label">Impostazioni</span>
      </a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!--
    Script classici (non moduli ES) caricati in ordine di dipendenza.
    Scelta deliberata: aprendo index.html con doppio click (file://), Chrome
    blocca il caricamento dei moduli ES per policy CORS. Con script classici
    l'app funziona sia via doppio click sia da un server locale.
  -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/formulario-data.js"></script>
  <script src="js/api/ai-text.js"></script>
  <script src="js/api/translate.js"></script>
  <script src="js/api/ocr.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/studio.js"></script>
  <script src="js/views/italiano.js"></script>
  <script src="js/views/matematica.js"></script>
  <script src="js/views/inglese.js"></script>
  <script src="js/views/storia.js"></script>
  <script src="js/views/voti.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/pwa-shell.js" data-app="schola" data-sw="sw.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
